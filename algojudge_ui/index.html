<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AlgoJudge — Luyện tập & Chấm bài</title>
<style>body{font-family:system-ui;margin:0;background:#f6f7f9}header{background:#1a73e8;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}main{max-width:960px;margin:16px auto;padding:0 12px}.card{background:#fff;border-radius:8px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px #0002}textarea{width:100%;min-height:220px;font-family:monospace}button{background:#1a73e8;color:#fff;border:0;padding:8px 16px;border-radius:6px;cursor:pointer}input,select{padding:6px}nav a{color:#fff;margin-left:12px}</style></head>
<body><header><img src="logo.svg" width="32" height="32" alt="AlgoJudge"><b>AlgoJudge</b> <span id="me"></span><nav><a href="teacher.html">Giảng viên</a><a href="ops.html">Ops</a></nav></header><main>
<div class="card"><h3>Đăng nhập</h3><input id="email" placeholder="email"> <input id="pass" type="password" placeholder="mật khẩu"> <button onclick="login()">Đăng nhập</button> <button onclick="reg()">Đăng ký</button></div>
<div class="card"><h3>Bài tập</h3><div id="plist"></div></div>
<div class="card"><h3>Soạn mã</h3><select id="lang" onchange="starter()"><option value="python">Python</option><option value="cpp">C++</option><option value="js">JavaScript</option><option value="java">Java</option><option value="go">Go</option><option value="c">C</option></select>
<textarea id="code">a,b=map(int,input().split());print(a+b)</textarea>
<textarea id="stdin" style="min-height:60px" placeholder="stdin chạy thử"></textarea><br><br>
<button onclick="run()">Chạy thử</button> <button onclick="submit()">Nộp bài</button><pre id="out"></pre></div>
<div class="card"><h3>Kết quả / Lịch sử</h3><div id="hist"></div></div>
</main><script>
const API=(localStorage.API||'http://localhost:8080/api/v1');let T=localStorage.T||'',PID=1,PVID=1;
async function api(p,o={}){o.headers={...(o.headers||{}),'Content-Type':'application/json',...(T?{Authorization:'Bearer '+T}:{})};const r=await fetch(API+p,o);return r.json()}
async function login(){const r=await api('/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:pass.value})});T=r.token;localStorage.T=T;load()}
async function reg(){const r=await api('/auth/register',{method:'POST',body:JSON.stringify({email:email.value,password:pass.value})});T=r.token;localStorage.T=T;load()}
async function load(){const p=await api('/problems');plist.innerHTML=(p.problems||[]).map(x=>`<div><b>#${x.id} ${x.title}</b> [${x.topic}/${x.difficulty}] <button onclick="pick(${x.id},${x.current_version_id})">Chọn</button></div>`).join('');const h=await api('/me/submissions');hist.innerHTML=(h.submissions||[]).map(s=>`#${s.id} ${s.language} <b>${s.verdict||'...'}</b> ${s.score}`).join('<br>')}
function pick(id,vid){PID=id;PVID=vid;out.textContent='Đã chọn bài #'+id}
function starter(){const S={python:'a,b=map(int,input().split());print(a+b)',cpp:'#include <bits/stdc++.h>\nusing namespace std;\nint main(){long long a,b;if(!(cin>>a>>b))return 0;cout<<a+b;}',js:'const fs=require("fs");const[a,b]=fs.readFileSync(0,"utf8").trim().split(/\\s+/).map(Number);console.log(a+b);',java:'import java.util.*;\npublic class Main{\npublic static void main(String[]a){\nScanner s=new Scanner(System.in);\nSystem.out.println(s.nextLong()+s.nextLong());}}',go:'package main\nimport "fmt"\nfunc main(){var a,b int;fmt.Scan(&a,&b);fmt.Println(a+b)}',c:'#include <stdio.h>\nint main(){long long a,b;if(scanf("%lld%lld",&a,&b)!=2)return 0;printf("%lld\\n",a+b);}'};if(S[lang.value])code.value=S[lang.value]}
async function run(){const r=await api('/run',{method:'POST',body:JSON.stringify({language:lang.value,source_code:code.value,stdin:stdin.value})});out.textContent=JSON.stringify(r,null,2)}
async function submit(){const r=await api('/submissions',{method:'POST',headers:{'Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({problem_version_id:PVID,language:lang.value,source_code:code.value})});out.textContent='Đã nộp #'+r.submission_id+' — đang theo dõi qua SSE...';const es=new EventSource(API+'/submissions/'+r.submission_id+'/events?token='+encodeURIComponent(T));es.onmessage=e=>{const s=JSON.parse(e.data);if(s.status&&s.status!=='QUEUED'&&s.status!=='RUNNING'){es.close();api('/submissions/'+r.submission_id).then(full=>{out.textContent=JSON.stringify(full,null,2);load()})}else out.textContent='Trạng thái: '+JSON.stringify(s)};es.onerror=()=>{es.close();out.textContent='SSE lỗi, dùng polling dự phòng...';const t=setInterval(async()=>{const s=await api('/submissions/'+r.submission_id);if(s.verdict){out.textContent=JSON.stringify(s,null,2);clearInterval(t);load()}},1500)}}
load();
</script></body></html>
